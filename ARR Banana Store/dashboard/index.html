<title>ARR Banana Store Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of stacked panels; KPI strip, branch table, daily chart, alerts, trend. */
:root {
  --bg: #f7f7f2;
  --panel: #ffffff;
  --ink: #1c1d17;
  --ink-2: #55574c;
  --ink-3: #85877b;
  --line: #e3e3d9;
  --accent: #d9a400;
  --accent-soft: #fbf1cc;
  --main: #2a78d6;
  --rizal: #eb6834;
  --good: #0ca30c;
  --warn: #b97f00;
  --bad: #d03b3b;
  --bad-soft: #fbe5e3;
  --good-soft: #e3f4e0;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161712; --panel: #1f201a; --ink: #f3f3ec; --ink-2: #c4c5b8; --ink-3: #8e9083;
    --line: #34362d; --accent: #f2c230; --accent-soft: #3a3214;
    --main: #3987e5; --rizal: #d95926; --good: #3cc23c; --warn: #f2b72a; --bad: #e66767;
    --bad-soft: #3d2120; --good-soft: #1e3320; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161712; --panel: #1f201a; --ink: #f3f3ec; --ink-2: #c4c5b8; --ink-3: #8e9083;
  --line: #34362d; --accent: #f2c230; --accent-soft: #3a3214;
  --main: #3987e5; --rizal: #d95926; --good: #3cc23c; --warn: #f2b72a; --bad: #e66767;
  --bad-soft: #3d2120; --good-soft: #1e3320; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 700 clamp(1.5rem, 4vw, 2.1rem)/1.1 var(--f-display); margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { font: 700 1.05rem/1.2 var(--f-display); margin: 0; }
.sub { color: var(--ink-2); margin: 4px 0 0; font-size: .9rem; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
label.lbl { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
select, .btn { font: 500 .9rem var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.btn { text-decoration: none; cursor: pointer; }
select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.note { color: var(--ink-3); font-size: .8rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.kpi .k { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font: 500 1.45rem/1.2 var(--f-num); font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .d { font-size: .8rem; color: var(--ink-2); margin-top: 2px; }
.kpi.hero { background: var(--accent-soft); border-color: transparent; }
.kpi.neg .v { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
td.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-bottom: none; }
tr.em td { font-weight: 600; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; background: var(--good-soft); }
.alert.bad { background: var(--bad-soft); }
.alert .ic { font: 700 .75rem var(--f-num); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--good); }
.alert.bad .ic { background: var(--bad); }
.alert b { display: block; font-weight: 600; }
.alert span { color: var(--ink-2); font-size: .85rem; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 11px var(--f-body); }
.legend { display: flex; gap: 16px; font-size: .85rem; color: var(--ink-2); flex-wrap: wrap; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 8px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); z-index: 2; }
.tip b { font-family: var(--f-num); font-weight: 500; }
.state { padding: 28px 18px; text-align: center; color: var(--ink-2); }
.state b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.1rem; margin-bottom: 4px; }
.status-line { font-size: .8rem; color: var(--ink-3); }
details summary { cursor: pointer; color: var(--ink-2); font-size: .85rem; margin-top: 10px; }
@media (prefers-reduced-motion: no-preference) { .bar { transition: opacity .15s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ARR Banana Store <span>Numbers</span></h1>
      <p class="sub">Live from the ARR Command Center sheet. Main (Pinagsama) and Rizal.</p>
    </div>
    <div class="controls">
      <label class="lbl" for="month">Month</label>
      <select id="month" disabled><option>Loading…</option></select>
      <a class="btn" href="https://docs.google.com/spreadsheets/d/1QUJ4fB8OfP10whBwcgBUgjlne_MkkcdjV2KpVLGfYDM/edit" target="_blank" rel="noopener">Open sheet</a>
    </div>
  </header>

  <div id="app">
    <div class="panel state" id="state"><b>Connecting to your Command Center</b>Reading sales, expenses and deliveries from Google Sheets. The first time, claude.ai asks you to allow the Google Sheets connector for this page.</div>
  </div>
  <p class="status-line" id="status"></p>
</div>

<script>
(function () {
  const SHEET = "1QUJ4fB8OfP10whBwcgBUgjlne_MkkcdjV2KpVLGfYDM";
  const SERVER = "Google Sheets";
  const RANGES = {
    daily: "'Daily Sales'!A5:I",
    expenses: "Expenses!A5:F",
    deliveries: "Deliveries!A5:F",
    stock: "'Stock Count'!A5:E",
    history: "History!A5:E",
    settings: "Settings!F5:F6"
  };
  const MON = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const raw = {}; const errs = {}; let stamp = 0; let selected = null;
  const $ = (id) => document.getElementById(id);

  function num(s) {
    if (s === undefined || s === null) return 0;
    let t = String(s).trim();
    if (t === "" || t === "-") return 0;
    let neg = false;
    if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
    const pct = t.endsWith("%");
    t = t.replace(/[₱,%\s]/g, "");
    if (t.startsWith("-")) { neg = !neg; t = t.slice(1); }
    let v = parseFloat(t); if (isNaN(v)) return 0;
    if (pct) v /= 100;
    return neg ? -v : v;
  }
  function parseDate(s) {
    if (!s) return null;
    const t = String(s).trim();
    let m = t.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
    if (m && MON[m[2].toLowerCase()] !== undefined) return new Date(+m[3], MON[m[2].toLowerCase()], +m[1]);
    m = t.match(/^([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
    if (m && MON[m[1].toLowerCase()] !== undefined) return new Date(+m[2], MON[m[1].toLowerCase()], 1);
    m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
    return null;
  }
  const mkey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const mlabel = (k) => { const [y, m] = k.split("-"); return MONTHS[+m - 1] + " " + y; };
  const peso = (v) => (v < 0 ? "(₱" : "₱") + Math.round(Math.abs(v)).toLocaleString("en-US") + (v < 0 ? ")" : "");
  const pct = (v) => (v * 100).toFixed(1) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function rows(name) { const p = raw[name]; return (p && Array.isArray(p.values)) ? p.values : []; }

  function model() {
    const limit = num((rows("settings")[0] || [])[0]) || 200;
    const spoilLimit = num((rows("settings")[1] || [])[0]) || 0.04;
    const M = {};
    const get = (k) => M[k] || (M[k] = { Main: blank(), Rizal: blank(), purchases: 0, kg: 0, trucking: 0, days: {} });
    function blank() { return { retail: 0, wholesale: 0, spoil: 0, cash: 0, reported: 0, short: 0, over: 0, opex: 0, staff: 0, lakSold: 0 }; }
    for (const r of rows("daily")) {
      const d = parseDate(r[0]); const b = (r[1] || "").trim();
      if (!d || (b !== "Main" && b !== "Rizal")) continue;
      const k = mkey(d); const m = get(k); const x = m[b];
      const retail = num(r[2]), whole = num(r[3]), cash = num(r[4]);
      x.retail += retail; x.wholesale += whole; x.spoil += num(r[5]); x.cash += cash; x.reported++; x.lakSold += num(r[6]);
      if (cash < -limit) x.short++; if (cash > limit) x.over++;
      const day = d.getDate(); m.days[day] = m.days[day] || { Main: 0, Rizal: 0, cashMain: null, cashRizal: null };
      m.days[day][b] += retail + whole; m.days[day]["cash" + b] = cash;
    }
    for (const r of rows("expenses")) {
      const d = parseDate(r[0]); if (!d) continue;
      const b = (r[1] || "").trim(), cat = (r[2] || "").trim(), amt = num(r[4]);
      const m = get(mkey(d));
      if (cat === "Trucking & Labor") { m.trucking += amt; continue; }
      if (b === "Main" || b === "Rizal") {
        m[b].opex += amt;
        if (cat === "Salary (net paid)" || cat === "Cash Advance") m[b].staff += amt;
      }
    }
    for (const r of rows("deliveries")) {
      const d = parseDate(r[0]); if (!d) continue;
      const m = get(mkey(d)); m.purchases += num(r[4]); m.kg += num(r[3]);
    }
    const stock = {};
    for (const r of rows("stock")) {
      const d = parseDate(r[0]); if (!d) continue;
      const k = mkey(d); stock[k] = (stock[k] || 0) + num(r[3]) * num(r[4]);
    }
    const prevKey = (k) => { const [y, mo] = k.split("-").map(Number); return mkey(new Date(y, mo - 2, 1)); };
    for (const k of Object.keys(M)) {
      const m = M[k];
      m.sales = { Main: m.Main.retail + m.Main.wholesale, Rizal: m.Rizal.retail + m.Rizal.wholesale };
      m.salesTotal = m.sales.Main + m.sales.Rizal;
      m.stockStart = stock[prevKey(k)] || 0; m.stockEnd = stock[k] || 0; m.hasCount = k in stock;
      m.cogs = m.purchases + m.trucking + m.stockStart - m.stockEnd;
      m.gm = m.salesTotal ? (m.salesTotal - m.cogs) / m.salesTotal : 0;
      m.gp = { Main: m.sales.Main * m.gm, Rizal: m.sales.Rizal * m.gm };
      m.net = { Main: m.gp.Main - m.Main.opex, Rizal: m.gp.Rizal - m.Rizal.opex };
      m.netTotal = m.net.Main + m.net.Rizal;
      m.spoilTotal = m.Main.spoil + m.Rizal.spoil;
    }
    const hist = [];
    for (const r of rows("history")) {
      const d = parseDate(r[0]); if (!d) continue;
      hist.push({ key: mkey(d), sales: num(r[1]), cash: num(r[4]) });
    }
    return { M, hist, limit, spoilLimit };
  }

  function daysSoFar(k) {
    const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" }));
    const [y, m] = k.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    if (now.getFullYear() > y || (now.getFullYear() === y && now.getMonth() + 1 > m)) return last;
    if (now.getFullYear() === y && now.getMonth() + 1 === m) return now.getDate();
    return 0;
  }

  function render() {
    const app = $("app");
    const names = Object.keys(RANGES);
    const loaded = names.filter((n) => raw[n]);
    if (!raw.daily) {
      if (errs.daily) { app.innerHTML = errorState(errs.daily); }
      return;
    }
    const { M, hist, limit, spoilLimit } = model();
    const keys = Object.keys(M).filter((k) => M[k].salesTotal || M[k].purchases).sort();
    if (!keys.length) { app.innerHTML = '<div class="panel state"><b>No sales entered yet</b>Once a branch enters its first row in the Daily Sales tab, the numbers appear here.</div>'; return; }
    if (!selected || !M[selected]) selected = keys[keys.length - 1];
    const sel = $("month");
    sel.innerHTML = keys.slice().reverse().map((k) => `<option value="${k}"${k === selected ? " selected" : ""}>${mlabel(k)}</option>`).join("");
    sel.disabled = false;
    const m = M[selected];
    const sofar = daysSoFar(selected);
    const partial = sofar && sofar < new Date(+selected.slice(0, 4), +selected.slice(5), 0).getDate();
    const spoilPct = m.salesTotal ? m.spoilTotal / m.salesTotal : 0;

    const kpi = (k, v, d, cls) => `<div class="kpi ${cls || ""}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
    let html = `<div class="kpis">
      ${kpi("Net profit", peso(m.netTotal), m.hasCount ? "after stock count" : "estimate: no stock count yet", "hero" + (m.netTotal < 0 ? " neg" : ""))}
      ${kpi("Sales", peso(m.salesTotal), partial ? `${sofar} days so far` : "full month")}
      ${kpi("Gross margin", pct(m.gm), "after fruit and trucking")}
      ${kpi("Operating expenses", peso(m.Main.opex + m.Rizal.opex), "rent, staff, food, other")}
      ${kpi("Spoilage", pct(spoilPct), `${peso(m.spoilTotal)} at cost, limit ${pct(spoilLimit)}`, spoilPct > spoilLimit ? "neg" : "")}
    </div>`;

    const row = (label, a, b, t, cls) => `<tr class="${cls || ""}"><td>${label}</td><td class="num">${a}</td><td class="num">${b}</td><td class="num">${t}</td></tr>`;
    html += `<div class="grid2">
      <section class="panel"><div class="panel-head"><h2>By branch</h2><span class="note">Fruit cost split by share of sales</span></div>
      <div class="tbl-wrap"><table>
        <tr><th></th><th><span class="swatch" style="background:var(--main)"></span>Main</th><th><span class="swatch" style="background:var(--rizal)"></span>Rizal</th><th>Total</th></tr>
        ${row("Retail sales", peso(m.Main.retail), peso(m.Rizal.retail), peso(m.Main.retail + m.Rizal.retail))}
        ${row("Wholesale sales", peso(m.Main.wholesale), peso(m.Rizal.wholesale), peso(m.Main.wholesale + m.Rizal.wholesale))}
        ${row("Gross profit", peso(m.gp.Main), peso(m.gp.Rizal), peso(m.gp.Main + m.gp.Rizal))}
        ${row("Operating expenses", peso(m.Main.opex), peso(m.Rizal.opex), peso(m.Main.opex + m.Rizal.opex))}
        ${row("Staff (salary + vale)", peso(m.Main.staff), peso(m.Rizal.staff), peso(m.Main.staff + m.Rizal.staff))}
        ${row("Net profit", peso(m.net.Main), peso(m.net.Rizal), peso(m.netTotal), "em")}
        ${row("Cash short / over", peso(m.Main.cash), peso(m.Rizal.cash), peso(m.Main.cash + m.Rizal.cash))}
        ${row("Days reported", m.Main.reported, m.Rizal.reported, "")}
      </table></div>
      <div class="tbl-wrap" style="margin-top:14px"><table>
        <tr><th>Cost of fruit</th><th></th></tr>
        <tr><td>Fruit purchases</td><td class="num">${peso(m.purchases)}</td></tr>
        <tr><td>Trucking and labor</td><td class="num">${peso(m.trucking)}</td></tr>
        <tr><td>Stock at start / end</td><td class="num">${peso(m.stockStart)} / ${peso(m.stockEnd)}</td></tr>
        <tr class="em"><td>Cost of fruit sold</td><td class="num">${peso(m.cogs)}</td></tr>
        <tr><td>Landed cost per kg</td><td class="num">${m.kg ? "₱" + ((m.purchases + m.trucking) / m.kg).toFixed(2) : "add kg to deliveries"}</td></tr>
      </table></div></section>
      <section class="panel"><div class="panel-head"><h2>Needs attention</h2><span class="note">Limits from the Settings tab</span></div>
      <div class="alerts">${alerts(m, sofar, limit, spoilLimit, spoilPct)}</div></section>
    </div>`;

    html += `<section class="panel"><div class="panel-head"><h2>Daily sales, ${mlabel(selected)}</h2>
      <div class="legend"><span><span class="swatch" style="background:var(--main)"></span>Main</span><span><span class="swatch" style="background:var(--rizal)"></span>Rizal</span></div></div>
      <div class="chart" id="daily"></div>
      <details><summary>Show as table</summary><div class="tbl-wrap">${dailyTable(m)}</div></details></section>`;

    html += `<section class="panel"><div class="panel-head"><h2>Monthly sales since Sep 2024</h2>
      <span class="note">Old trackers until Sep 2026, Command Center after${partial ? "; current month is month to date" : ""}</span></div>
      <div class="chart" id="trend"></div></section>`;

    app.innerHTML = html;
    drawDaily(m, selected);
    drawTrend(hist, M, keys);
    const missing = names.filter((n) => errs[n]).map((n) => n);
    $("status").textContent = (stamp ? "Updated " + new Date(stamp).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ". " : "") +
      (missing.length ? "Could not read: " + missing.join(", ") + " (" + errs[missing[0]].code + ")." : "") +
      (loaded.length < names.length && !missing.length ? " Still loading some tabs…" : "");
  }

  function alerts(m, sofar, limit, spoilLimit, spoilPct) {
    const out = [];
    const a = (bad, title, text) => out.push(`<div class="alert${bad ? " bad" : ""}" role="status"><div class="ic" aria-hidden="true">${bad ? "!" : "✓"}</div><div><b>${title}</b><span>${text}</span></div></div>`);
    for (const b of ["Main", "Rizal"]) {
      const miss = Math.max(0, sofar - m[b].reported);
      if (miss) a(true, `${b}: ${miss} day${miss > 1 ? "s" : ""} without a report`, "Includes today if tonight's report is not in yet.");
      if (m[b].short) a(true, `${b}: cash short on ${m[b].short} day${m[b].short > 1 ? "s" : ""}`, `Short by more than ${peso(limit)}. Check the Notes column for the reason.`);
      if (m[b].over) a(true, `${b}: cash over on ${m[b].over} day${m[b].over > 1 ? "s" : ""}`, `Over by more than ${peso(limit)}. Usually an unrecorded sale or payment.`);
    }
    if (spoilPct > spoilLimit) a(true, `Spoilage ${pct(spoilPct)} of sales`, `Above the ${pct(spoilLimit)} limit.`);
    if (!m.hasCount) a(true, "No month-end stock count", "Profit counts all fruit bought this month as sold until the count is entered.");
    if (m.netTotal < 0) a(true, "Net profit is negative", "Check expenses and purchase timing for this month.");
    if (!m.Main.staff && !m.Rizal.staff) a(true, "No salary or vale entered", "Profit is too high until staff costs are in the Expenses tab.");
    if (!out.length) a(false, "Nothing needs attention", "All limits are within the Settings values.");
    return out.join("");
  }

  function dailyTable(m) {
    const days = Object.keys(m.days).map(Number).sort((a, b) => a - b);
    return `<table><tr><th>Day</th><th>Main</th><th>Rizal</th><th>Total</th><th>Cash Main</th><th>Cash Rizal</th></tr>` +
      days.map((d) => { const x = m.days[d]; return `<tr><td>${d}</td><td class="num">${peso(x.Main)}</td><td class="num">${peso(x.Rizal)}</td><td class="num">${peso(x.Main + x.Rizal)}</td><td class="num">${x.cashMain === null ? "" : peso(x.cashMain)}</td><td class="num">${x.cashRizal === null ? "" : peso(x.cashRizal)}</td></tr>`; }).join("") + "</table>";
  }

  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function short(v) { return v >= 1e6 ? "₱" + (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "M" : v >= 1e3 ? "₱" + Math.round(v / 1e3) + "k" : "₱" + Math.round(v); }

  function tipFor(host) {
    let t = host.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; t.hidden = true; host.appendChild(t); }
    return t;
  }
  function bindTips(host) {
    const tip = tipFor(host);
    host.querySelectorAll("[data-tip]").forEach((el) => {
      const show = () => {
        const r = el.getBoundingClientRect(), h = host.getBoundingClientRect();
        tip.innerHTML = el.getAttribute("data-tip"); tip.hidden = false;
        tip.style.left = Math.min(Math.max(r.left - h.left + r.width / 2, 70), h.width - 70) + "px";
        tip.style.top = (r.top - h.top) + "px";
        host.querySelectorAll(".bar").forEach((b) => b.style.opacity = b.dataset.g === el.dataset.g ? 1 : .45);
      };
      const hide = () => { tip.hidden = true; host.querySelectorAll(".bar").forEach((b) => b.style.opacity = 1); };
      el.addEventListener("mouseenter", show); el.addEventListener("mouseleave", hide);
      el.addEventListener("focus", show); el.addEventListener("blur", hide);
    });
  }

  function drawDaily(m, k) {
    const host = $("daily"); const [y, mo] = k.split("-").map(Number); const n = new Date(y, mo, 0).getDate();
    const W = 960, H = 260, L = 48, R = 8, T = 12, B = 28; const pw = W - L - R, ph = H - T - B;
    let max = 0; for (const d in m.days) max = Math.max(max, m.days[d].Main + m.days[d].Rizal);
    max = niceMax(max * 1.05); const bw = pw / n; const barW = Math.max(4, bw - 4);
    const yv = (v) => T + ph - (v / max) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales by branch">`;
    for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = yv(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${short(v)}</text>`; }
    for (let d = 1; d <= n; d++) {
      const x = L + (d - 1) * bw + (bw - barW) / 2; const v = m.days[d];
      if (d === 1 || d % 5 === 0) s += `<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${d}</text>`;
      if (!v) continue;
      const tot = v.Main + v.Rizal; const yM = yv(v.Main), yT = yv(tot);
      const tip = `${MONTHS[mo - 1]} ${d}<br>Main <b>${peso(v.Main)}</b><br>Rizal <b>${peso(v.Rizal)}</b><br>Total <b>${peso(tot)}</b>`;
      s += `<g tabindex="0" data-g="${d}" data-tip="${esc(tip)}"><rect x="${x - 2}" y="${T}" width="${barW + 4}" height="${ph}" fill="transparent"/>`;
      s += `<rect class="bar" data-g="${d}" x="${x}" y="${yM}" width="${barW}" height="${Math.max(0, T + ph - yM)}" fill="var(--main)"/>`;
      if (v.Rizal > 0) s += `<rect class="bar" data-g="${d}" x="${x}" y="${yT}" width="${barW}" height="${Math.max(0, yM - yT - 2)}" rx="3" fill="var(--rizal)"/>`;
      s += `</g>`;
    }
    s += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--ink-3)" stroke-width="1"/></svg>`;
    host.innerHTML = s; bindTips(host);
  }

  function drawTrend(hist, M, keys) {
    const host = $("trend"); const map = new Map();
    for (const h of hist) map.set(h.key, { sales: h.sales, src: "old" });
    for (const k of keys) if (M[k].salesTotal) map.set(k, { sales: M[k].salesTotal, src: "new" });
    const ks = [...map.keys()].sort(); if (!ks.length) { host.innerHTML = '<p class="note">No monthly history found.</p>'; return; }
    const W = 960, H = 240, L = 48, R = 8, T = 12, B = 28; const pw = W - L - R, ph = H - T - B;
    let max = 0; for (const k of ks) max = Math.max(max, map.get(k).sales); max = niceMax(max * 1.05);
    const bw = pw / ks.length, barW = Math.max(4, bw - 4); const yv = (v) => T + ph - (v / max) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly sales">`;
    for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = yv(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${short(v)}</text>`; }
    ks.forEach((k, i) => {
      const v = map.get(k); const x = L + i * bw + (bw - barW) / 2; const yy = yv(v.sales);
      const [y, mo] = k.split("-").map(Number);
      if (mo === 1 || i === 0) s += `<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${MONTHS[mo - 1]} ${String(y).slice(2)}</text>`;
      const tip = `${mlabel(k)}<br>Sales <b>${peso(v.sales)}</b><br>${v.src === "new" ? "Command Center" : "Old tracker"}`;
      s += `<g tabindex="0" data-g="m${i}" data-tip="${esc(tip)}"><rect x="${x - 2}" y="${T}" width="${barW + 4}" height="${ph}" fill="transparent"/>`;
      s += `<rect class="bar" data-g="m${i}" x="${x}" y="${yy}" width="${barW}" height="${T + ph - yy}" rx="3" fill="${v.src === "new" ? "var(--accent)" : "var(--main)"}"/></g>`;
    });
    s += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--ink-3)" stroke-width="1"/></svg>`;
    s += `<div class="legend" style="margin-top:8px"><span><span class="swatch" style="background:var(--main)"></span>Old trackers</span><span><span class="swatch" style="background:var(--accent)"></span>Command Center</span></div>`;
    host.innerHTML = s; bindTips(host);
  }

  function errorState(e) {
    const c = e && e.code;
    const msg = {
      needs_reauth: ["Google Sheets needs reconnecting", "Reconnect Google Sheets in claude.ai Settings, Connectors, then reload this page."],
      server_not_connected: ["Google Sheets is not connected", "Add the Google Sheets connector in claude.ai Settings, Connectors, then reload this page."],
      selection_required: ["Choose a Google Sheets account", "You have more than one Google Sheets connector. Pick one when claude.ai asks, then reload."],
      not_in_manifest: ["Google Sheets is turned off for this page", "Allow Google Sheets in this page's Permissions menu to see your numbers."],
      blocked_by_policy: ["Blocked by your organization", "Your organization's policy blocks this connector."],
      tool_error: ["The sheet could not be read", (e.message || "") + " Check that this Google account can open the ARR Command Center."],
      server_unavailable: ["Google Sheets did not answer", "Try reloading in a minute."]
    }[c] || ["Could not load the numbers", (e && e.message) || "Reload the page to try again."];
    return `<div class="panel state"><b>${esc(msg[0])}</b>${esc(msg[1])}</div>`;
  }

  $("month").addEventListener("change", (ev) => { selected = ev.target.value; render(); });

  (async function start() {
    const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
    if (!mcp) {
      $("app").innerHTML = '<div class="panel state"><b>Open this page in claude.ai</b>Live numbers come from your Google Sheets connector, which only works inside claude.ai.</div>';
      return;
    }
    for (const [name, range] of Object.entries(RANGES)) {
      mcp.watchTool(SERVER, "get_values", { spreadsheetId: SHEET, range }, (ev) => {
        if (ev.type === "data") {
          raw[name] = ev.result.payload || {}; delete errs[name];
          const t = ev.result.cache ? ev.result.cache.storedAt : Date.now(); stamp = Math.max(stamp, t);
        } else {
          const c = ev.error && ev.error.code;
          if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest"].includes(c)) delete raw[name];
          errs[name] = ev.error || { code: "upstream_error" };
        }
        render();
      }, { refetchInterval: 300000 });
    }
  })();
})();
</script>
